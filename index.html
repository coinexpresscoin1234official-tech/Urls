<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora OS</title>
<style>
:root{
  --accent:#0a84ff;
  --text:#f5f5f7; --dim:rgba(245,245,247,.55);
  --glass:rgba(40,40,45,.62); --glass2:rgba(255,255,255,.07); --side:rgba(255,255,255,.04);
  --line:rgba(255,255,255,.1); --win:rgba(34,34,38,.8);
  --ring:0 0 0 .5px rgba(0,0,0,.6); --shadow:0 28px 80px rgba(0,0,0,.5);
  --lights:rgba(255,255,255,.2);
}
body.light{
  --text:#1d1d1f; --dim:rgba(29,29,31,.55);
  --glass:rgba(246,246,249,.68); --glass2:rgba(0,0,0,.05); --side:rgba(0,0,0,.03);
  --line:rgba(0,0,0,.1); --win:rgba(250,250,252,.84);
  --ring:0 0 0 .5px rgba(0,0,0,.25); --shadow:0 28px 80px rgba(20,30,60,.28);
  --lights:rgba(0,0,0,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font:13px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;letter-spacing:-.01em;color:var(--text);user-select:none;-webkit-font-smoothing:antialiased}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;cursor:default}
input,textarea{font:inherit;letter-spacing:inherit;color:inherit;outline:none}
svg{display:block;flex:none}
.blur{backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8)}
.dim{color:var(--dim)}

/* wallpaper */
#wall{position:fixed;inset:0;background-size:cover;transition:background .8s}
.wp0{background:radial-gradient(120% 80% at 12% 0,#3b4290 0,transparent 55%),radial-gradient(90% 70% at 100% 15%,#6e3f86 0,transparent 55%),radial-gradient(130% 70% at 50% 125%,#d0714e 0,transparent 62%),linear-gradient(#0e1126,#191430)}
.wp1{background:radial-gradient(100% 80% at 20% 0,#fff 0,transparent 60%),radial-gradient(100% 90% at 95% 100%,#9dc3ff 0,transparent 60%),linear-gradient(#dde7f7,#c3d4ef)}
.wp2{background:radial-gradient(100% 80% at 30% 0,#50535e 0,transparent 60%),radial-gradient(90% 70% at 95% 100%,#2d3242 0,transparent 60%),#16171b}
.wp3{background:radial-gradient(110% 80% at 85% 0,#df8a4e 0,transparent 55%),radial-gradient(100% 80% at 0 100%,#7b2b4b 0,transparent 60%),linear-gradient(#2a1226,#4a1e33)}
#dimmer{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:99990}

/* menu bar */
#bar{position:fixed;top:0;left:0;right:0;height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;z-index:9000;background:var(--glass);border-bottom:.5px solid var(--line);font-weight:500}
#bar .g{display:flex;align-items:center;gap:1px}
.mi{padding:2px 9px;border-radius:5px;display:flex;align-items:center;gap:6px;height:22px}
.mi:hover,.mi.on{background:var(--glass2)}
.mi.b{font-weight:700}
#menu{position:fixed;top:30px;min-width:230px;padding:5px;border-radius:10px;background:var(--glass);border:.5px solid var(--line);box-shadow:var(--shadow),var(--ring);z-index:9800;display:none}
#menu button{display:flex;justify-content:space-between;gap:24px;width:100%;padding:4px 10px;border-radius:5px;text-align:left}
#menu button:hover:not(:disabled){background:var(--accent);color:#fff}
#menu button:disabled{opacity:.4}
#menu hr{border:0;border-top:.5px solid var(--line);margin:5px 8px}
#menu .k{opacity:.55}

/* widgets */
#widgets{position:fixed;top:44px;right:16px;width:232px;display:flex;flex-direction:column;gap:12px;z-index:1}
.card{background:var(--glass);border:.5px solid var(--line);border-radius:20px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
.cal h5{font-size:12px;font-weight:600;color:#ff453a;margin-bottom:8px}
.cal .gr{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;row-gap:3px}
.cal .gr span{height:22px;display:grid;place-items:center;border-radius:50%}
.cal .gr .h{color:var(--dim);font-weight:600}
.cal .gr .t{background:#ff453a;color:#fff;font-weight:600}
.wx{display:flex;justify-content:space-between;align-items:center}
.wx b{font-size:34px;font-weight:300;letter-spacing:-.03em}

/* dock */
#dockwrap{position:fixed;bottom:8px;left:0;right:0;display:flex;justify-content:center;z-index:9000;pointer-events:none}
#dock{pointer-events:auto;display:flex;align-items:flex-end;gap:8px;padding:7px 8px;border-radius:24px;background:var(--glass);border:.5px solid var(--line);box-shadow:var(--shadow),var(--ring)}
.dk{position:relative;width:50px;height:50px;border-radius:22.5%;display:grid;place-items:center;color:#fff;transition:width .18s,height .18s;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.22),inset 0 1px 0 rgba(255,255,255,.3),0 2px 6px rgba(0,0,0,.25)}
.dk svg{width:54%;height:54%}
#dock.hov .dk{transition:none}
.dk::after{content:attr(data-n);position:absolute;top:-38px;left:50%;transform:translateX(-50%);background:var(--glass);backdrop-filter:blur(30px);border:.5px solid var(--line);padding:3px 10px;border-radius:7px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s}
.dk:hover::after{opacity:1}
.dk.run::before{content:"";position:absolute;bottom:-5px;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:50%;background:var(--text);opacity:.8}

/* windows */
.win{position:fixed;display:flex;flex-direction:column;background:var(--win);border-radius:12px;overflow:hidden;min-width:300px;min-height:220px;resize:both;box-shadow:var(--ring),0 10px 30px rgba(0,0,0,.25);animation:pop .2s cubic-bezier(.2,.9,.3,1)}
.win.active{box-shadow:var(--ring),var(--shadow),inset 0 0 0 .5px var(--line)}
@keyframes pop{from{opacity:0;transform:scale(.965)}}
.win.max{inset:28px 0 0 0!important;width:auto!important;height:auto!important;border-radius:0;resize:none}
.win.min{display:none}
.tb{position:relative;height:38px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--dim)}
.win.active .tb{color:var(--text)}
.lights{position:absolute;left:13px;display:flex;gap:8px}
.lights i{width:12px;height:12px;border-radius:50%;background:var(--lights);display:grid;place-items:center;color:rgba(0,0,0,.6)}
.win.active .lights i:nth-child(1){background:#ff5f57}.win.active .lights i:nth-child(2){background:#febc2e}.win.active .lights i:nth-child(3){background:#28c840}
.lights svg{width:8px;height:8px;opacity:0}.lights:hover svg{opacity:1}
.body{flex:1;overflow:auto;position:relative;min-height:0}
.split{display:flex;height:100%}
.side{width:168px;flex:none;padding:8px;background:var(--side);border-right:.5px solid var(--line);overflow:auto}
.side h6{font-size:11px;font-weight:600;color:var(--dim);padding:8px 10px 4px}
.side button{display:flex;align-items:center;gap:9px;width:100%;padding:6px 10px;border-radius:7px;text-align:left}
.side button svg{color:var(--accent)}
.side button:hover{background:var(--glass2)}
.side button.on{background:color-mix(in srgb,var(--accent) 28%,transparent)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.tool{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:.5px solid var(--line);font-weight:600}
.tool .sp{flex:1}
.ibtn{width:26px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--dim)}.ibtn:hover{background:var(--glass2);color:var(--text)}

/* files */
.grid{flex:1;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,92px);gap:6px;align-content:start;overflow:auto}
.fi{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:8px;font-size:12px;text-align:center}
.fi.sel .lb{background:var(--accent);color:#fff}.fi.sel .ico{background:var(--glass2);border-radius:8px}
.lb{padding:1px 6px;border-radius:5px;max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ico{width:60px;height:52px;display:grid;place-items:center}
.doc{width:38px;height:48px;border-radius:5px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:8px;font-weight:700;color:#6b7280;letter-spacing:.04em}
.status{padding:5px 12px;border-top:.5px solid var(--line);font-size:11px;color:var(--dim);text-align:center}

/* notes */
.nl{width:210px;flex:none;border-right:.5px solid var(--line);background:var(--side);display:flex;flex-direction:column}
.nl .list{flex:1;overflow:auto;padding:6px}
.ni{display:block;width:100%;text-align:left;padding:9px 11px;border-radius:8px}
.ni.on{background:#f5b82e;color:#111}.ni.on .dim{color:rgba(0,0,0,.6)}
.ni b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni .dim{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
textarea.ed{flex:1;width:100%;padding:20px 24px;background:transparent;border:0;resize:none;font-size:15px;line-height:1.65;user-select:text}

/* calculator */
.calc{background:#1c1c1e;color:#fff;height:100%;display:flex;flex-direction:column;padding:0 10px 10px}
.calc .d{flex:1;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 10px 8px;font-size:56px;font-weight:300;letter-spacing:-.03em;min-height:80px;white-space:nowrap;overflow:hidden}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;height:74%}
.keys button{border-radius:999px;background:#505055;font-size:22px;transition:filter .1s}
.keys button:active{filter:brightness(1.5)}
.keys .f{background:#3a3a3e}.keys .o{background:#ff9f0a}.keys .z{grid-column:span 2;text-align:left;padding-left:26px;border-radius:999px}

/* browser */
.addr{display:flex;align-items:center;gap:6px;padding:0 12px 8px}
.addr .pill{flex:1;max-width:420px;margin:0 auto;background:var(--glass2);border-radius:8px;height:28px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--dim);font-size:12.5px}
.bstart{padding:56px 24px;text-align:center}
.bstart h2{font-size:26px;font-weight:600;letter-spacing:-.03em;margin-bottom:6px}
.fav{display:grid;grid-template-columns:repeat(4,72px);gap:22px 20px;justify-content:center;margin-top:36px}
.fav button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;color:var(--dim)}
.fav i{width:60px;height:60px;border-radius:15px;display:grid;place-items:center;font-style:normal;font-size:22px;font-weight:600;color:#fff}

/* music */
.music{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
.art{width:190px;height:190px;border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.4);transition:background .5s}
.mt{text-align:center}.mt b{display:block;font-size:17px;font-weight:600}
.bar{width:80%;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.bar .tr{flex:1;height:4px;border-radius:2px;background:var(--glass2);overflow:hidden}.bar .tr div{height:100%;width:0;background:var(--text);opacity:.85}
.ctl{display:flex;gap:22px;align-items:center}
.ctl button{color:var(--text)}.ctl .pp svg{width:34px;height:34px}

/* photos */
.ph{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.ph button{aspect-ratio:1}
.ph button:hover{filter:brightness(1.15)}
.view{position:absolute;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;color:#fff}
.view .top{display:flex;justify-content:space-between;padding:10px 14px}
.view .top button{padding:4px 12px;border-radius:7px;background:rgba(255,255,255,.14)}
.view .im{flex:1;margin:0 24px 24px;border-radius:10px}

/* terminal */
.term{background:rgba(18,18,20,.94);color:#e8e8ea;height:100%;padding:12px 14px;font:12.5px/1.55 ui-monospace,"SF Mono",Menlo,Consolas,monospace;overflow:auto;user-select:text}
.term input{background:none;border:0;color:#fff;width:60%;font:inherit}
.term .p{color:#7fd6a0}

/* settings */
.pane{flex:1;padding:22px 26px;overflow:auto}
.pane h3{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-bottom:18px}
.pane h4{font-size:12px;font-weight:600;color:var(--dim);margin:20px 0 8px}
.thm{display:inline-flex;flex-direction:column;align-items:center;gap:8px;margin-right:16px}
.thm i{width:104px;height:66px;border-radius:9px;border:2px solid transparent;box-shadow:0 0 0 .5px var(--line);display:block}
.thm.on i{border-color:var(--accent)}.thm.on span{font-weight:600}
.sw{width:22px;height:22px;border-radius:50%;margin-right:10px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.3);position:relative}
.sw.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--accent)}
.wg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.wg button{text-align:left;font-size:12px}.wg i{display:block;height:84px;border-radius:9px;margin-bottom:6px;border:2px solid transparent;box-shadow:0 0 0 .5px var(--line)}.wg .on i{border-color:var(--accent)}
.grp{background:var(--glass2);border-radius:10px}.grp div{display:flex;justify-content:space-between;padding:10px 14px}.grp div+div{border-top:.5px solid var(--line)}

/* panels */
.panel{position:fixed;background:var(--glass);border:.5px solid var(--line);border-radius:18px;box-shadow:var(--shadow),var(--ring);z-index:9500;display:none}
.panel.show{display:block;animation:pop .16s ease-out}
#cc{top:34px;right:8px;width:322px;padding:12px}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.ct{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--glass2);text-align:left}
.ct .ci{width:32px;height:32px;border-radius:50%;background:var(--glass2);display:grid;place-items:center;flex:none}
.ct.on .ci{background:var(--accent);color:#fff}
.ct b{display:block;font-weight:600;font-size:12.5px}.ct span{font-size:11.5px;color:var(--dim)}
.sl{background:var(--glass2);border-radius:14px;padding:8px 12px 10px;margin-top:8px}.sl label{font-size:12px;font-weight:600;display:block;margin-bottom:6px}
.rng{position:relative}
.rng input{-webkit-appearance:none;appearance:none;width:100%;height:28px;border-radius:14px;background:linear-gradient(to right,#fff var(--v,50%),rgba(255,255,255,.18) var(--v,50%))}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;width:1px;height:28px;background:transparent}
.rng input::-moz-range-thumb{width:1px;height:28px;background:transparent;border:0}
.rng svg{position:absolute;left:8px;top:6px;color:#333;pointer-events:none}
#spot{top:17%;left:50%;transform:translateX(-50%);width:min(620px,92vw);padding:10px;border-radius:16px}
#spot.show{animation:none}
.sbox{display:flex;align-items:center;gap:12px;padding:6px 10px;color:var(--dim)}
#q{flex:1;background:transparent;border:0;font-size:22px;font-weight:300;color:var(--text)}
#res{max-height:320px;overflow:auto;margin-top:4px}
#res button{display:flex;align-items:center;gap:12px;width:100%;padding:7px 10px;border-radius:9px;text-align:left}
#res button.on{background:var(--accent);color:#fff}
.mini{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}.mini svg{width:16px;height:16px}

/* toast, lock */
#toasts{position:fixed;top:38px;right:12px;display:flex;flex-direction:column;gap:8px;z-index:9600;pointer-events:none}
.toast{background:var(--glass);border:.5px solid var(--line);border-radius:16px;padding:11px 14px;width:310px;display:flex;gap:11px;align-items:center;animation:pop .25s ease-out;box-shadow:var(--shadow)}
.toast b{display:block;font-weight:600}.toast span{color:var(--dim);font-size:12.5px}
#lock{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;color:#fff;background:rgba(0,0,0,.22);backdrop-filter:blur(30px) brightness(.85);-webkit-backdrop-filter:blur(30px) brightness(.85);transition:opacity .6s,transform .6s;cursor:default}
#lock.gone{opacity:0;transform:scale(1.04);pointer-events:none}
#lockd{margin-top:9vh;font-size:20px;font-weight:500;opacity:.9}
#lockt{font-size:min(120px,24vw);font-weight:200;letter-spacing:-.04em;line-height:1.05}
#lockb{margin-top:auto;margin-bottom:8vh;display:flex;flex-direction:column;align-items:center;gap:10px}
.av{width:64px;height:64px;border-radius:50%;background:linear-gradient(160deg,#9aa0b4,#5b6075);display:grid;place-items:center;font-size:26px;font-weight:600;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.3)}
.pass{padding:7px 20px;border-radius:999px;background:rgba(255,255,255,.18);font-size:12.5px}
@media (max-width:820px){#widgets{display:none}.dk{width:40px;height:40px}}
</style>
</head>
<body>
<div id="wall" class="wp0"></div>
<div id="bar" class="blur">
  <div class="g" id="lbar"></div>
  <div class="g" id="rbar"></div>
</div>
<div id="menu" class="blur"></div>

<div id="widgets">
  <div class="card cal" id="cal"></div>
  <div class="card wx"><div><div class="dim" style="font-size:12px;font-weight:600">Clear</div><b>22°</b><div class="dim" style="font-size:12px">H 25°  L 16°</div></div><div id="sun" style="color:#ffd60a"></div></div>
</div>

<div id="dockwrap"><div id="dock"></div></div>

<div class="panel blur" id="cc">
  <div class="cg">
    <button class="ct on" id="tWifi"><span class="ci" id="iw"></span><div><b>Wi-Fi</b><span>Home network</span></div></button>
    <button class="ct" id="tBt"><span class="ci" id="ib"></span><div><b>Bluetooth</b><span>Off</span></div></button>
    <button class="ct on" id="tDark"><span class="ci" id="id"></span><div><b>Dark mode</b><span>On</span></div></button>
    <button class="ct" id="tDnd"><span class="ci" id="im"></span><div><b>Focus</b><span>Off</span></div></button>
  </div>
  <div class="sl"><label>Display</label><div class="rng"><span id="isun"></span><input type="range" id="bright" min="35" max="100" value="100"></div></div>
  <div class="sl"><label>Sound</label><div class="rng"><span id="ivol"></span><input type="range" id="vol" min="0" max="100" value="60"></div></div>
</div>

<div class="panel blur" id="spot">
  <div class="sbox"><span id="isearch"></span><input id="q" placeholder="Spotlight Search" autocomplete="off" spellcheck="false"></div>
  <div id="res"></div>
</div>

<div id="toasts"></div>
<div id="dimmer"></div>

<div id="lock">
  <div id="lockd"></div><div id="lockt"></div>
  <div id="lockb"><div class="av">S</div><div style="font-weight:600;font-size:15px">Student</div><div class="pass">Click or press Enter to unlock</div></div>
</div>

<script>
const $=s=>document.querySelector(s);
const P={

 compass:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
 note:'<path d="M7 3h7l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
 calc:'<rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8.5 7.5h7M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"/>',
 music:'<path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>',
 image:'<rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-9 9"/>',
 term:'<path d="M5 8l4 4-4 4M12 16h7"/>',
 sliders:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
 search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
 wifi:'<path d="M4.5 9.5a11 11 0 0 1 15 0M7.5 13a6.5 6.5 0 0 1 9 0M12 17h.01"/>',
 battery:'<rect x="2.5" y="8" width="17" height="9" rx="2.5"/><path d="M22 11.5v2"/><rect x="4.5" y="10" width="10" height="5" rx="1" fill="currentColor" stroke="none"/>',
 moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',

calc(b){
 b.innerHTML='<div class="calc"><div class="d">0</div><div class="keys"></div></div>';
 const d=b.querySelector('.d'),keys=b.querySelector('.keys');
 let cur='0',prev=null,op=null,fresh=false;
 const fmt=s=>{if(s==='Error'||s.includes('e'))return s;const[i,f]=s.split('.');return(i==='-0'?'-0':Number(i).toLocaleString('en-US'))+(f!==undefined?'.'+f:'')};
 const draw=()=>{d.textContent=fmt(cur);d.style.fontSize=cur.length>12?'30px':cur.length>8?'40px':'56px'};
 const calc=()=>{const a=prev,c=parseFloat(cur);let r=c;if(op==='÷')r=c===0?NaN:a/c;if(op==='×')r=a*c;if(op==='−')r=a-c;if(op==='+')r=a+c;cur=isNaN(r)?'Error':String(+r.toPrecision(12))};
 const K=[['AC','f'],['±','f'],['%','f'],['÷','o'],['7'],['8'],['9'],['×','o'],['4'],['5'],['6'],['−','o'],['1'],['2'],['3'],['+','o'],['0','z'],['.'],['=','o']];
 K.forEach(([k,c])=>{const bt=document.createElement('button');bt.textContent=k;bt.className=c||'';
  bt.onclick=()=>{
   if(/\d/.test(k)){cur=(fresh||cur==='0'||cur==='Error')?k:cur+k;fresh=false}
   else if(k==='.'){if(fresh){cur='0.';fresh=false}else if(!cur.includes('.'))cur+='.'}
   else if(k==='AC'){cur='0';prev=null;op=null;fresh=false}
   else if(k==='±'&&cur!=='Error')cur=String(-parseFloat(cur));
   else if(k==='%'&&cur!=='Error')cur=String(parseFloat(cur)/100);
   else if(k==='='){if(op&&prev!==null){calc();op=null;prev=null;fresh=true}}
   else if('÷×−+'.includes(k)){if(op&&!fresh)calc();prev=parseFloat(cur);op=k;fresh=true}
   draw()};keys.appendChild(bt)});
},

/* ---------- setters ---------- */
function setTheme(t){state.theme=t;document.body.classList.toggle('light',t==='light');const on=t==='dark';$('#tDark').classList.toggle('on',on);$('#tDark span:last-child').textContent=on?'On':'Off';if(wins.settings&&wins.settings.rerender)wins.settings.rerender()}
function setAccent(i){state.accent=i;document.documentElement.style.setProperty('--accent',accents[i])}
function setWall(i){state.wall=i;const w=$('#wall');w.style.background='';w.className=wallpapers[i].c}

/* ---------- windows ---------- */
function openApp(id,opt={}){
 if(wins[id]){const w=wins[id];w.classList.remove('min');if(opt.pane){state.pane=opt.pane;w.rerender&&w.rerender()}focus(w);return}
 if(opt.pane)state.pane=opt.pane;
 const a=APPS[id],w=document.createElement('div'),n=Object.keys(wins).length;
 w.className='win blur';
 const W=Math.min(a.w,innerWidth-24),H=Math.min(a.h,innerHeight-120);
 w.style.width=W+'px';w.style.height=H+'px';
 w.style.left=Math.max(12,(innerWidth-W)/2-60+n*30)+'px';w.style.top=Math.max(40,(innerHeight-H)/2-40+n*30)+'px';
 w.innerHTML=`<div class="tb"><div class="lights"><i data-a="x"><svg viewBox="0 0 8 8" stroke="currentColor" stroke-width="1.3" fill="none"><path d="M1.5 1.5l5 5M6.5 1.5l-5 5"/></svg></i><i data-a="m"><svg viewBox="0 0 8 8" stroke="currentColor" stroke-width="1.3" fill="none"><path d="M1.2 4h5.6"/></svg></i><i data-a="z"><svg viewBox="0 0 8 8" stroke="currentColor" stroke-width="1.3" fill="none"><path d="M4 1.2v5.6M1.2 4h5.6"/></svg></i></div>${a.n}</div><div class="body"></div>`;
 document.body.appendChild(w);wins[id]=w;w.dataset.id=id;
 build[id](w.querySelector('.body'));
 w.querySelector('.lights').onclick=e=>{const k=e.target.closest('i');if(!k)return;const c=k.dataset.a;if(c==='x')closeWin(id);if(c==='m')minWin(id);if(c==='z')w.classList.toggle('max')};
 w.querySelector('.tb').ondblclick=e=>{if(!e.target.closest('.lights'))w.classList.toggle('max')};
 drag(w);w.addEventListener('pointerdown',()=>focus(w));focus(w);
}
function closeWin(id){const w=wins[id];if(!w)return;if(w.onclose)w.onclose();w.remove();delete wins[id];updateDock();nextFocus()}
function minWin(id){const w=wins[id];if(!w)return;w.classList.add('min');updateDock();nextFocus()}
function focus(w){w.style.zIndex=++zTop;document.querySelectorAll('.win').forEach(x=>x.classList.toggle('active',x===w));state.active=w.dataset.id;setAppName();updateDock()}
function nextFocus(){const v=Object.values(wins).filter(w=>!w.classList.contains('min')).sort((a,b)=>a.style.zIndex-b.style.zIndex).pop();if(v)focus(v);else{state.active=null;setAppName()}}
function setAppName(){$('#appn').textContent=state.active?APPS[state.active].n:'Desktop'}
function drag(w){
 const tb=w.querySelector('.tb');
 tb.onpointerdown=e=>{if(e.target.closest('.lights')||w.classList.contains('max'))return;
  const dx=e.clientX-w.offsetLeft,dy=e.clientY-w.offsetTop;tb.setPointerCapture(e.pointerId);
  tb.onpointermove=m=>{w.style.left=Math.min(innerWidth-90,Math.max(-w.offsetWidth+120,m.clientX-dx))+'px';w.style.top=Math.min(innerHeight-40,Math.max(28,m.clientY-dy))+'px'};
  tb.onpointerup=()=>{tb.onpointermove=null}};
}

/* ---------- dock with magnification ---------- */
const dock=$('#dock');
Object.entries(APPS).forEach(([id,a])=>{const b=document.createElement('button');b.className='dk';b.dataset.n=a.n;b.dataset.id=id;b.style.background=a.c;b.innerHTML=ic(a.i,28,1.6);b.onclick=()=>openApp(id);dock.appendChild(b)});
dock.onmousemove=e=>{dock.classList.add('hov');dock.querySelectorAll('.dk').forEach(b=>{const r=b.getBoundingClientRect(),d=Math.abs(e.clientX-(r.left+r.width/2)),s=Math.max(0,1-d/130);b.style.width=b.style.height=(50+s*s*30)+'px'})};
dock.onmouseleave=()=>{dock.classList.remove('hov');dock.querySelectorAll('.dk').forEach(b=>{b.style.width=b.style.height=''})};

}
function closeMenu(){menuOpen=null;$('#menu').style.display='none';document.querySelectorAll('#lbar .mi').forEach(x=>x.classList.remove('on'))}
document.querySelectorAll('#lbar [data-m]').forEach(b=>{b.onclick=e=>{e.stopPropagation();showMenu(b.dataset.m,b)};b.onmouseenter=()=>{if(menuOpen&&menuOpen!==b.dataset.m){menuOpen=null;showMenu(b.dataset.m,b)}}});
function closePanels(){$('#cc').classList.remove('show');$('#spot').classList.remove('show');closeMenu()}

/* ---------- spotlight ---------- */
const ACTS=[['Toggle Dark Mode','contrast',()=>setTheme(state.theme==='dark'?'light':'dark')],['Next Wallpaper','image',()=>setWall((state.wall+1+4)%4)],['Lock Screen','lock',()=>lock()]];
function spot(open){closePanels();$('#spot').classList.toggle('show',open);if(open){$('#q').value='';$('#q').focus();renderRes('')}}
function renderRes(q){
 q=q.toLowerCase();const r=$('#res');r.innerHTML='';
 const items=[...Object.entries(APPS).map(([id,a])=>[a.n,a.i,()=>openApp(id),a.c]),...ACTS].filter(x=>x[0].toLowerCase().includes(q));
 items.forEach((x,i)=>{const b=document.createElement('button');if(i===0)b.className='on';b.innerHTML=`<span class="mini" style="background:${x[3]||'#636366'}">${ic(x[1],16)}</span>${x[0]}`;b.onclick=()=>{spot(false);x[2]()};r.appendChild(b)});
 if(!items.length)r.innerHTML='<div class="dim" style="padding:12px">No results</div>';
}
$('#q').oninput=e=>renderRes(e.target.value);
$('#q').onkeydown=e=>{if(e.key==='Enter'){const f=$('#res button');if(f)f.click()}};
$('#bSearch').onclick=e=>{e.stopPropagation();spot(!$('#spot').classList.contains('show'))};

/* ---------- control center ---------- */
$('#iw').innerHTML=ic('wifi',17);$('#ib').innerHTML=ic('bt',17);$('#id').innerHTML=ic('contrast',17);$('#im').innerHTML=ic('moon',17);
$('#isun').innerHTML=ic('sun',16);$('#ivol').innerHTML=ic('vol',16);$('#isearch').innerHTML=ic('search',22,1.6);$('#sun').innerHTML=ic('sun',38,1.4);
$('#ccBtn').onclick=e=>{e.stopPropagation();const s=$('#cc').classList.contains('show');closePanels();if(!s)$('#cc').classList.add('show')};
$('#cc').onclick=e=>e.stopPropagation();$('#spot').onclick=e=>e.stopPropagation();
const tog=(id,fn)=>{$(id).onclick=()=>{const on=$(id).classList.toggle('on');$(id).querySelector('span:last-child').textContent=on?'On':'Off';fn&&fn(on)}};
tog('#tWifi',on=>$('#wifiI').style.opacity=on?1:.4);tog('#tBt');
tog('#tDnd',on=>{if(on)toast('Focus','Notifications are paused','settings',true)});
$('#tDark').onclick=()=>setTheme(state.theme==='dark'?'light':'dark');
$('#wifiI').onclick=()=>$('#tWifi').click();
const rng=(id,fn)=>{const r=$(id),u=()=>{r.style.setProperty('--v',((r.value-r.min)/(r.max-r.min)*100)+'%');fn&&fn(+r.value)};r.oninput=u;u()};
rng('#bright',v=>$('#dimmer').style.opacity=(100-v)/110);rng('#vol');
document.addEventListener('click',closePanels);

/* ---------- toast / lock / clock ---------- */
function toast(t,m,app,force){if($('#tDnd').classList.contains('on')&&!force)return;const a=APPS[app]||APPS.settings;
 const d=document.createElement('div');d.className='toast blur';d.innerHTML=`<span class="mini" style="background:${a.c};width:34px;height:34px;border-radius:9px">${ic(a.i,18)}</span><div><b>${t}</b><span>${m}</span></div>`;
 $('#toasts').appendChild(d);setTimeout(()=>d.remove(),3400)}
function lock(){closePanels();$('#lock').classList.remove('gone')}
function unlock(){if($('#lock').classList.contains('gone'))return;$('#lock').classList.add('gone');setTimeout(()=>toast('Welcome','Press Ctrl + Space to search','settings'),600)}
$('#lock').onclick=unlock;
document.addEventListener('keydown',e=>{
 if(e.key==='Enter')unlock();
 if((e.ctrlKey||e.metaKey)&&e.code==='Space'){e.preventDefault();spot(!$('#spot').classList.contains('show'))}
 if(e.key==='Escape')closePanels();
});
function clock(){const d=new Date(),t=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
 $('#clk').textContent=d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})+'  '+t;
 $('#lockt').textContent=t.replace(/\s?[AP]M/i,'');$('#lockd').textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}
function calendar(){const d=new Date(),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
 let h=`<h5>${d.toLocaleDateString([],{month:'long',year:'numeric'})}</h5><div class="gr">`+'SMTWTFS'.split('').map(x=>`<span class="h">${x}</span>`).join('');
 for(let i=0;i<first;i++)h+='<span></span>';for(let i=1;i<=days;i++)h+=`<span class="${i===d.getDate()?'t':''}">${i}</span>`;$('#cal').innerHTML=h+'</div>'}
clock();setInterval(clock,15000);calendar();setAccent(0);
</script>
</body>
</html>
