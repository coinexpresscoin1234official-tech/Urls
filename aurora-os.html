<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora OS</title>
<style>
:root{
  --accent:#0a84ff;
  --text:#f5f5f7; --dim:rgba(245,245,247,.55);
  --glass:rgba(40,40,45,.62); --glass2:rgba(255,255,255,.07); --side:rgba(255,255,255,.04);
  --line:rgba(255,255,255,.1); --win:rgba(34,34,38,.8);
  --ring:0 0 0 .5px rgba(0,0,0,.6); --shadow:0 28px 80px rgba(0,0,0,.5);
  --lights:rgba(255,255,255,.2);
}
body.light{
  --text:#1d1d1f; --dim:rgba(29,29,31,.55);
  --glass:rgba(246,246,249,.68); --glass2:rgba(0,0,0,.05); --side:rgba(0,0,0,.03);
  --line:rgba(0,0,0,.1); --win:rgba(250,250,252,.84);
  --ring:0 0 0 .5px rgba(0,0,0,.25); --shadow:0 28px 80px rgba(20,30,60,.28);
  --lights:rgba(0,0,0,.14);
}
body.solid{--glass:rgb(44,44,48);--win:rgb(30,30,34)}
body.solid.light{--glass:rgb(244,244,247);--win:rgb(250,250,252)}
body.solid .blur{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font:13px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;letter-spacing:-.01em;color:var(--text);user-select:none;-webkit-font-smoothing:antialiased}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;cursor:default}
input,textarea{font:inherit;letter-spacing:inherit;color:inherit;outline:none}
svg{display:block;flex:none}
.blur{backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8)}
.dim{color:var(--dim)}

/* wallpaper */
#wall{position:fixed;inset:0;background-size:cover;transition:background .8s,filter .2s}
.wp0{background:radial-gradient(120% 80% at 12% 0,#3b4290 0,transparent 55%),radial-gradient(90% 70% at 100% 15%,#6e3f86 0,transparent 55%),radial-gradient(130% 70% at 50% 125%,#d0714e 0,transparent 62%),linear-gradient(#0e1126,#191430)}
.wp1{background:radial-gradient(100% 80% at 20% 0,#fff 0,transparent 60%),radial-gradient(100% 90% at 95% 100%,#9dc3ff 0,transparent 60%),linear-gradient(#dde7f7,#c3d4ef)}
.wp2{background:radial-gradient(100% 80% at 30% 0,#50535e 0,transparent 60%),radial-gradient(90% 70% at 95% 100%,#2d3242 0,transparent 60%),#16171b}
.wp3{background:radial-gradient(110% 80% at 85% 0,#df8a4e 0,transparent 55%),radial-gradient(100% 80% at 0 100%,#7b2b4b 0,transparent 60%),linear-gradient(#2a1226,#4a1e33)}
.wp4{background:radial-gradient(110% 80% at 20% 0,#1f8f7a 0,transparent 55%),radial-gradient(90% 70% at 100% 30%,#3b5bb5 0,transparent 55%),radial-gradient(120% 70% at 50% 120%,#7a4fa3 0,transparent 60%),linear-gradient(#08161f,#0d1f2b)}
.wp5{background:radial-gradient(110% 80% at 80% 0,#3fa7d6 0,transparent 55%),radial-gradient(110% 80% at 0 100%,#0b3a6b 0,transparent 60%),linear-gradient(#0a2a4a,#0e4a78)}
.wp6{background:radial-gradient(100% 80% at 80% 0,#fff2dc 0,transparent 60%),radial-gradient(100% 90% at 10% 100%,#e8b48a 0,transparent 60%),linear-gradient(#f0dcc4,#e2c3a0)}
.wp7{background:radial-gradient(100% 80% at 15% 0,#c56bd6 0,transparent 55%),radial-gradient(100% 80% at 100% 100%,#3a3fa8 0,transparent 60%),linear-gradient(#1c1030,#2a1550)}
#dimmer{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:99990}

/* menu bar */
#bar{position:fixed;top:0;left:0;right:0;height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;z-index:9000;background:var(--glass);border-bottom:.5px solid var(--line);font-weight:500}
#bar .g{display:flex;align-items:center;gap:1px}
.mi{padding:2px 9px;border-radius:5px;display:flex;align-items:center;gap:6px;height:22px}
.mi:hover,.mi.on{background:var(--glass2)}
.mi.b{font-weight:700}
#menu{position:fixed;top:30px;min-width:230px;padding:5px;border-radius:10px;background:var(--glass);border:.5px solid var(--line);box-shadow:var(--shadow),var(--ring);z-index:9800;display:none}
#menu button{display:flex;justify-content:space-between;gap:24px;width:100%;padding:4px 10px;border-radius:5px;text-align:left}
#menu button:hover:not(:disabled){background:var(--accent);color:#fff}
#menu button:disabled{opacity:.4}
#menu hr{border:0;border-top:.5px solid var(--line);margin:5px 8px}
#menu .k{opacity:.55}

/* widgets */
#wlayer{position:fixed;inset:0;z-index:1;pointer-events:none}
.wd{position:absolute;pointer-events:auto;transform-origin:0 0;background:var(--glass);border:.5px solid var(--line);border-radius:20px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.18);cursor:grab;-webkit-backdrop-filter:blur(40px) saturate(1.8);backdrop-filter:blur(40px) saturate(1.8)}
body.solid .wd{backdrop-filter:none}
.wd:active{cursor:grabbing}
.wd.sticky{background:color-mix(in srgb,#ffd60a 26%,var(--glass))}
.wcl{position:absolute;top:-8px;left:-8px;width:22px;height:22px;border-radius:50%;background:var(--glass);border:.5px solid var(--line);display:none;place-items:center;color:var(--dim);cursor:pointer}
.wd:hover .wcl{display:grid}
.wcl:hover{color:var(--text)}
.rs{position:absolute;right:0;bottom:0;width:24px;height:24px;cursor:nwse-resize;opacity:0}
.rs::after{content:"";position:absolute;right:8px;bottom:8px;width:9px;height:9px;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);border-radius:0 0 5px 0}
.wd:hover .rs{opacity:.7}
.wt{font-size:12px;font-weight:600;color:var(--dim);margin-bottom:6px}
.chd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.chd h5{font-size:12.5px;font-weight:600;color:#ff453a}
.chd span{display:flex}
.gr{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;row-gap:3px}
.gr span{height:22px;display:grid;place-items:center;border-radius:50%}
.gr .h{color:var(--dim);font-weight:600}
.gr .t{background:#ff453a;color:#fff;font-weight:600}
.wxr{display:flex;justify-content:space-between;align-items:center}
.wxr b{font-size:34px;font-weight:300;letter-spacing:-.03em;display:block}
.hrs{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:.5px solid var(--line)}
.hrs div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px}
.hrs b{font-weight:600}
.wd textarea{display:block;width:100%;height:120px;background:transparent;border:0;resize:none;font-size:14px;line-height:1.5;user-select:text}
.tr{display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:.5px solid var(--line)}
.tr span{flex:1}.tr .dn{text-decoration:line-through;color:var(--dim)}
.ck{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--dim);display:grid;place-items:center;color:#fff;flex:none}
.ck.on{background:var(--accent);border-color:var(--accent)}
.dl{color:var(--dim);opacity:0}.tr:hover .dl{opacity:1}
.ad{width:100%;margin-top:8px;background:var(--glass2);border:0;border-radius:8px;padding:6px 10px;user-select:text}
.tm{font-size:44px;font-weight:300;letter-spacing:-.03em;margin:2px 0 10px;font-variant-numeric:tabular-nums}
.wr{display:flex;justify-content:space-between;padding:6px 0;border-bottom:.5px solid var(--line)}
.wr b{font-weight:600;font-variant-numeric:tabular-nums}
.wd .btn{padding:4px 10px;font-size:12px}

/* dock */
#dockwrap{position:fixed;bottom:8px;left:0;right:0;display:flex;justify-content:center;z-index:9000;pointer-events:none;transition:transform .38s cubic-bezier(.2,.8,.2,1)}
#dockwrap.hide{transform:translateY(140%)}
#hot{position:fixed;bottom:0;left:20%;right:20%;height:10px;z-index:8999}
#dock{pointer-events:auto;display:flex;align-items:flex-end;gap:8px;padding:7px 8px;border-radius:24px;background:var(--glass);border:.5px solid var(--line);box-shadow:var(--shadow),var(--ring)}
.dk{position:relative;width:var(--dk,50px);height:var(--dk,50px);border-radius:22.5%;transition:width .18s,height .18s;box-shadow:0 2px 6px rgba(0,0,0,.28),inset 0 0 0 .5px rgba(255,255,255,.2)}
.dk svg{width:100%;height:100%;border-radius:22.5%}
#dock.hov .dk{transition:none}
.dk::after{content:attr(data-n);position:absolute;top:-38px;left:50%;transform:translateX(-50%);background:var(--glass);backdrop-filter:blur(30px);border:.5px solid var(--line);padding:3px 10px;border-radius:7px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s}
.dk:hover::after{opacity:1}
.dk.run::before{content:"";position:absolute;bottom:-5px;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:50%;background:var(--text);opacity:.8}
.mini2{display:block;flex:none;width:28px;height:28px;border-radius:22.5%;overflow:hidden}
.mini2 svg{width:100%;height:100%}

/* windows */
.win{position:fixed;display:flex;flex-direction:column;background:var(--win);border-radius:12px;overflow:hidden;min-width:300px;min-height:220px;resize:both;box-shadow:var(--ring),0 10px 30px rgba(0,0,0,.25);animation:pop .2s cubic-bezier(.2,.9,.3,1)}
.win.active{box-shadow:var(--ring),var(--shadow),inset 0 0 0 .5px var(--line)}
@keyframes pop{from{opacity:0;transform:scale(.965)}}
.win.max{inset:28px 0 0 0!important;width:auto!important;height:auto!important;border-radius:0;resize:none}
.win.min{display:none}
.tb{position:relative;height:38px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--dim)}
.win.active .tb{color:var(--text)}
.lights{position:absolute;left:13px;display:flex;gap:8px}
.lights i{width:12px;height:12px;border-radius:50%;background:var(--lights);display:grid;place-items:center;color:rgba(0,0,0,.6)}
.win.active .lights i:nth-child(1){background:#ff5f57}.win.active .lights i:nth-child(2){background:#febc2e}.win.active .lights i:nth-child(3){background:#28c840}
.lights svg{width:8px;height:8px;opacity:0}.lights:hover svg{opacity:1}
.body{flex:1;overflow:auto;position:relative;min-height:0}
.split{display:flex;height:100%}
.side{width:168px;flex:none;padding:8px;background:var(--side);border-right:.5px solid var(--line);overflow:auto}
.side h6{font-size:11px;font-weight:600;color:var(--dim);padding:8px 10px 4px}
.side button{display:flex;align-items:center;gap:9px;width:100%;padding:6px 10px;border-radius:7px;text-align:left}
.side button svg{color:var(--accent)}
.side button:hover{background:var(--glass2)}
.side button.on{background:color-mix(in srgb,var(--accent) 28%,transparent)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.tool{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:.5px solid var(--line);font-weight:600}
.tool .sp{flex:1}
.ibtn{width:26px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--dim)}.ibtn:hover{background:var(--glass2);color:var(--text)}

/* files */
.grid{flex:1;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,92px);gap:6px;align-content:start;overflow:auto}
.fi{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:8px;font-size:12px;text-align:center}
.fi.sel .lb{background:var(--accent);color:#fff}.fi.sel .ico{background:var(--glass2);border-radius:8px}
.lb{padding:1px 6px;border-radius:5px;max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ico{width:60px;height:52px;display:grid;place-items:center}
.doc{width:38px;height:48px;border-radius:5px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:8px;font-weight:700;color:#6b7280;letter-spacing:.04em}
.status{padding:5px 12px;border-top:.5px solid var(--line);font-size:11px;color:var(--dim);text-align:center}

/* notes */
.nl{width:210px;flex:none;border-right:.5px solid var(--line);background:var(--side);display:flex;flex-direction:column}
.nl .list{flex:1;overflow:auto;padding:6px}
.ni{display:block;width:100%;text-align:left;padding:9px 11px;border-radius:8px}
.ni.on{background:#f5b82e;color:#111}.ni.on .dim{color:rgba(0,0,0,.6)}
.ni b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni .dim{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
textarea.ed{flex:1;width:100%;padding:20px 24px;background:transparent;border:0;resize:none;font-size:15px;line-height:1.65;user-select:text}

/* calculator */
.calc{background:#1c1c1e;color:#fff;height:100%;display:flex;flex-direction:column;padding:0 10px 10px}
.calc .d{flex:1;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 10px 8px;font-size:56px;font-weight:300;letter-spacing:-.03em;min-height:80px;white-space:nowrap;overflow:hidden}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;height:74%}
.keys button{border-radius:999px;background:#505055;font-size:22px;transition:filter .1s}
.keys button:active{filter:brightness(1.5)}
.keys .f{background:#3a3a3e}.keys .o{background:#ff9f0a}.keys .z{grid-column:span 2;text-align:left;padding-left:26px;border-radius:999px}

/* browser */
.bstart{padding:56px 24px;text-align:center}
.bstart h2{font-size:26px;font-weight:600;letter-spacing:-.03em;margin-bottom:6px}
.fav{display:grid;grid-template-columns:repeat(4,72px);gap:22px 20px;justify-content:center;margin-top:36px}
.fav button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;color:var(--dim)}
.fav i{width:60px;height:60px;border-radius:15px;display:grid;place-items:center;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.3)}
.fav button:hover i{transform:translateY(-2px);transition:.15s}
.fav i svg{width:30px;height:30px}

/* music */
.music{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
.art{width:190px;height:190px;border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.4);transition:background .5s}
.mt{text-align:center}.mt b{display:block;font-size:17px;font-weight:600}
.bar{width:80%;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.bar .tr2{flex:1;height:4px;border-radius:2px;background:var(--glass2);overflow:hidden}.bar .tr2 div{height:100%;width:0;background:var(--text);opacity:.85}
.ctl{display:flex;gap:22px;align-items:center}
.ctl button{color:var(--text)}

/* photos */
.ph{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.ph button{aspect-ratio:1}
.ph button:hover{filter:brightness(1.15)}
.view{position:absolute;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;color:#fff}
.view .top{display:flex;justify-content:space-between;padding:10px 14px}
.view .top button{padding:4px 12px;border-radius:7px;background:rgba(255,255,255,.14)}
.view .im{flex:1;margin:0 24px 24px;border-radius:10px}

/* terminal */
.term{background:rgba(18,18,20,.94);color:#e8e8ea;height:100%;padding:12px 14px;font:12.5px/1.55 ui-monospace,"SF Mono",Menlo,Consolas,monospace;overflow:auto;user-select:text}
.term input{background:none;border:0;color:#fff;width:60%;font:inherit}
.term .p{color:#7fd6a0}

/* settings */
.pane{flex:1;padding:22px 26px;overflow:auto}
.pane h3{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-bottom:18px}
.pane h4{font-size:12px;font-weight:600;color:var(--dim);margin:20px 0 8px}
.pane p{color:var(--dim);line-height:1.6;margin-bottom:10px}
.thm{display:inline-flex;flex-direction:column;align-items:center;gap:8px;margin-right:16px}
.thm i{width:104px;height:66px;border-radius:9px;border:2px solid transparent;box-shadow:0 0 0 .5px var(--line);display:block}
.thm.on i{border-color:var(--accent)}.thm.on span{font-weight:600}
.sw{width:22px;height:22px;border-radius:50%;margin-right:10px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.3);position:relative}
.sw.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--accent)}
.wg4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.wg4 button{text-align:center;font-size:11.5px}.wg4 i{display:block;height:58px;border-radius:9px;margin-bottom:5px;border:2px solid transparent;box-shadow:0 0 0 .5px var(--line)}.wg4 .on i{border-color:var(--accent)}
.grp{background:var(--glass2);border-radius:10px}.grp>div{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;min-height:42px}.grp>div+div{border-top:.5px solid var(--line)}
.tgl{width:40px;height:24px;border-radius:12px;background:rgba(120,120,128,.4);position:relative;flex:none;transition:.2s}
.tgl i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:.2s}
.tgl.on{background:var(--accent)}.tgl.on i{left:18px}
input[type=range].s2{accent-color:var(--accent);width:190px}
.fld{display:block;width:100%;max-width:340px;padding:8px 12px;border-radius:8px;border:.5px solid var(--line);background:var(--glass2);margin-bottom:8px;user-select:text}
.btn{padding:6px 14px;border-radius:8px;background:var(--accent);color:#fff;font-weight:600}
.btn.ghost{background:var(--glass2);color:var(--text)}
.btn.sm{padding:3px 12px;font-size:12px}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.msg{min-height:20px;margin-top:10px;font-size:12.5px}

/* panels */
.panel{position:fixed;background:var(--glass);border:.5px solid var(--line);border-radius:18px;box-shadow:var(--shadow),var(--ring);z-index:9500;display:none}
.panel.show{display:block;animation:pop .16s ease-out}
#cc{top:34px;right:8px;width:322px;padding:12px}
#wg{top:34px;right:8px;width:310px;padding:14px}
.wgh{font-size:15px;font-weight:700;margin-bottom:10px}
.wgr{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:.5px solid var(--line)}
.wgf{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.mini{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}.mini svg{width:16px;height:16px}
.mini.gy{background:#636366}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.ct{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--glass2);text-align:left}
.ct .ci{width:32px;height:32px;border-radius:50%;background:var(--glass2);display:grid;place-items:center;flex:none}
.ct.on .ci{background:var(--accent);color:#fff}
.ct b{display:block;font-weight:600;font-size:12.5px}.ct span{font-size:11.5px;color:var(--dim)}
.sl{background:var(--glass2);border-radius:14px;padding:8px 12px 10px;margin-top:8px}.sl label{font-size:12px;font-weight:600;display:block;margin-bottom:6px}
.rng{position:relative}
.rng input{-webkit-appearance:none;appearance:none;width:100%;height:28px;border-radius:14px;background:linear-gradient(to right,#fff var(--v,50%),rgba(255,255,255,.18) var(--v,50%))}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;width:1px;height:28px;background:transparent}
.rng input::-moz-range-thumb{width:1px;height:28px;background:transparent;border:0}
.rng svg{position:absolute;left:8px;top:6px;color:#333;pointer-events:none}
#spot{top:17%;left:50%;transform:translateX(-50%);width:min(620px,92vw);padding:10px;border-radius:16px}
#spot.show{animation:none}
.sbox{display:flex;align-items:center;gap:12px;padding:6px 10px;color:var(--dim)}
#q{flex:1;background:transparent;border:0;font-size:22px;font-weight:300;color:var(--text)}
#res{max-height:320px;overflow:auto;margin-top:4px}
#res button{display:flex;align-items:center;gap:12px;width:100%;padding:7px 10px;border-radius:9px;text-align:left}
#res button.on{background:var(--accent);color:#fff}

/* toast, lock */
#toasts{position:fixed;top:38px;right:12px;display:flex;flex-direction:column;gap:8px;z-index:9600;pointer-events:none}
.toast{background:var(--glass);border:.5px solid var(--line);border-radius:16px;padding:11px 14px;width:310px;display:flex;gap:11px;align-items:center;animation:pop .25s ease-out;box-shadow:var(--shadow)}
.toast b{display:block;font-weight:600}.toast span.t{color:var(--dim);font-size:12.5px}
#lock{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;color:#fff;background:rgba(0,0,0,.22);backdrop-filter:blur(30px) brightness(.85);-webkit-backdrop-filter:blur(30px) brightness(.85);transition:opacity .6s,transform .6s}

try{Object.assign(state,JSON.parse(localStorage.getItem(KEY))||{});state.wallCss=localStorage.getItem(KEY+'.wall')||state.wallCss}catch{}

async function hashPw(p){const s='aurora|'+p;if(window.crypto&&crypto.subtle){try{const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}catch{}}let x=5381;for(const c of s)x=((x<<5)+x+c.charCodeAt(0))|0;return 'f'+x}

calc(b){
 b.innerHTML='<div class="calc"><div class="d">0</div><div class="keys"></div></div>';
 const d=b.querySelector('.d'),keys=b.querySelector('.keys');
 let cur='0',prev=null,op=null,fresh=false;
 const fmt=s=>{if(s==='Error'||s.includes('e'))return s;const[i,f]=s.split('.');return(i==='-0'?'-0':Number(i).toLocaleString('en-US'))+(f!==undefined?'.'+f:'')};
 const draw=()=>{d.textContent=fmt(cur);d.style.fontSize=cur.length>12?'30px':cur.length>8?'40px':'56px'};
 const calc=()=>{const a=prev,c=parseFloat(cur);let r=c;if(op==='÷')r=c===0?NaN:a/c;if(op==='×')r=a*c;if(op==='−')r=a-c;if(op==='+')r=a+c;cur=isNaN(r)?'Error':String(+r.toPrecision(12))};
 const K=[['AC','f'],['±','f'],['%','f'],['÷','o'],['7'],['8'],['9'],['×','o'],['4'],['5'],['6'],['−','o'],['1'],['2'],['3'],['+','o'],['0','z'],['.'],['=','o']];
 K.forEach(([k,c])=>{const bt=document.createElement('button');bt.textContent=k;bt.className=c||'';
  bt.onclick=()=>{
   if(/\d/.test(k)){cur=(fresh||cur==='0'||cur==='Error')?k:cur+k;fresh=false}
   else if(k==='.'){if(fresh){cur='0.';fresh=false}else if(!cur.includes('.'))cur+='.'}
   else if(k==='AC'){cur='0';prev=null;op=null;fresh=false}
   else if(k==='±'&&cur!=='Error')cur=String(-parseFloat(cur));
   else if(k==='%'&&cur!=='Error')cur=String(parseFloat(cur)/100);
   else if(k==='='){if(op&&prev!==null){calc();op=null;prev=null;fresh=true}}
   else if('÷×−+'.includes(k)){if(op&&!fresh)calc();prev=parseFloat(cur);op=k;fresh=true}
   draw()};keys.appendChild(bt)});
},

timer:{n:'Focus Timer',i:'clock',w:210,mk(b,it){const T=it._t||(it._t={mode:0,left:1500,run:false}),L=[1500,300];
 const fm=()=>Math.floor(T.left/60)+':'+String(T.left%60).padStart(2,'0');
 const draw=()=>{b.innerHTML=`<div class="wt">${T.mode?'Break':'Focus'}</div><div class="tm">${fm()}</div><div class="row2"><button class="btn" data-a="go">${T.run?'Pause':'Start'}</button><button class="btn ghost" data-a="rs">Reset</button><button class="btn ghost" data-a="md">${T.mode?'Focus':'Break'}</button></div>`;
  b.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>{const a=x.dataset.a;if(a==='go')T.run=!T.run;if(a==='rs'){T.run=false;T.left=L[T.mode]}if(a==='md'){T.mode^=1;T.run=false;T.left=L[T.mode]}draw()})};
 draw();
 return()=>{if(!T.run)return;T.left--;if(T.left<=0){T.run=false;const nm=T.mode?'Break':'Focus';T.left=L[T.mode];toast('Timer',nm+' session finished','settings');draw()}else{const tm=b.querySelector('.tm');if(tm)tm.textContent=fm()}}}},
world:{n:'World Clock',i:'globe',w:236,mk(b){const C=[['New York','America/New_York'],['London','Europe/London'],['Tokyo','Asia/Tokyo'],['Sydney','Australia/Sydney']];
 b.innerHTML=`<div class="wt">World Clock</div>`+C.map((c,i)=>`<div class="wr"><span>${c[0]}</span><b data-i="${i}"></b></div>`).join('');
 return()=>{b.querySelectorAll('b').forEach(x=>{x.textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit',timeZone:C[+x.dataset.i][1]})})}}}
};
function renderWidget(it){
 const T=WD[it.type];if(!T)return;
 const el=document.createElement('div');el.className='wd';el.dataset.id=it.id;
 el.style.cssText=`width:${T.w}px;left:${it.x}px;top:${it.y}px;transform:scale(${it.s})`;
 el.innerHTML=`<button class="wcl" title="Remove">${ic('x',11,2.2)}</button><div class="wb"></div><i class="rs"></i>`;
 $('#wlayer').appendChild(el);if(!it.d)it.d={};
 const u=T.mk(el.querySelector('.wb'),it);el._u=u;if(u)u();
 el.querySelector('.wcl').onclick=()=>{state.widgets=state.widgets.filter(x=>x!==it);el.remove();save();buildGallery()};
 el.onpointerdown=e=>{if(e.target.closest('button,input,textarea,.rs'))return;
  const dx=e.clientX-it.x,dy=e.clientY-it.y;el.setPointerCapture(e.pointerId);
  el.onpointermove=m=>{it.x=Math.min(innerWidth-60,Math.max(-T.w*it.s+60,m.clientX-dx));it.y=Math.min(innerHeight-50,Math.max(32,m.clientY-dy));el.style.left=it.x+'px';el.style.top=it.y+'px'};
  el.onpointerup=()=>{el.onpointermove=null;save()}};
 const rs=el.querySelector('.rs');
 rs.onpointerdown=e=>{e.stopPropagation();rs.setPointerCapture(e.pointerId);
  rs.onpointermove=m=>{it.s=Math.min(2.4,Math.max(.6,(m.clientX-it.x)/T.w));el.style.transform=`scale(${it.s})`};
  rs.onpointerup=()=>{rs.onpointermove=null;save()}};
}
function addWidget(type){const n=state.widgets.length,it={id:uid(),type,x:Math.max(20,innerWidth-WD[type].w-24-(n%4)*34),y:48+(n%6)*44,s:1,d:{}};state.widgets.push(it);renderWidget(it);save();buildGallery()}
function clearWidgets(){state.widgets=[];$('#wlayer').innerHTML='';save();buildGallery()}
function buildGallery(){$('#wgl').innerHTML=Object.entries(WD).map(([k,t])=>`<div class="wgr"><span class="mini gy">${ic(t.i,16)}</span><span style="flex:1">${t.n}</span><button class="btn sm" data-k="${k}">Add</button></div>`).join('');
 $('#wgl').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>addWidget(b.dataset.k));$('#wgc').textContent=state.widgets.length+' on desktop'}
function openGallery(){closePanels();buildGallery();$('#wg').classList.add('show')}
$('#wgClear').onclick=clearWidgets;$('#wg').onclick=e=>e.stopPropagation();
setInterval(()=>document.querySelectorAll('.wd').forEach(e=>e._u&&e._u()),1000);

/* ---------- menu bar ---------- */
const MENUS={
 aurora:[['About Aurora OS',()=>openApp('settings',{pane:'about'})],['System Settings',()=>openApp('settings')],'-',['Lock Screen',()=>lock()]],
 File:[['Close Window',()=>state.active&&closeWin(state.active)]],
 Edit:[['Undo',null,'Ctrl Z'],['Redo',null,'Ctrl Y'],'-',['Copy',null,'Ctrl C'],['Paste',null,'Ctrl V']],
 View:[['Enter Full Screen',()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(),'F11'],['Toggle Dark Mode',()=>setTheme(state.theme==='dark'?'light':'dark')],['Edit Widgets',()=>openGallery()]],
 Window:[['Minimize',()=>state.active&&minWin(state.active)],['Zoom',()=>state.active&&wins[state.active].classList.toggle('max')]],
 Help:[['Search',()=>spot(true),'Ctrl Space']]
};
const CTX=[['Add Widgets…',()=>openGallery()],['Next Wallpaper',()=>setWall((Math.max(state.wall,-1)+1)%wallpapers.length)],['Change Wallpaper…',()=>openApp('settings',{pane:'wallpaper'})],'-',['System Settings',()=>openApp('settings')],['Lock Screen',()=>lock()]];
$('#lbar').innerHTML=`<button class="mi" data-m="aurora">${ic('star',15)}</button><button class="mi b" id="appn">Desktop</button>`+['File','Edit','View','Window','Help'].map(m=>`<button class="mi" data-m="${m}">${m}</button>`).join('');
$('#appn').onclick=e=>e.stopPropagation();
$('#rbar').innerHTML=`<button class="mi" id="wgBtn">${ic('layout',16)}</button><button class="mi" id="bSearch">${ic('search',15)}</button><button class="mi" id="wifiI">${ic('wifi',16)}</button><span class="mi">${ic('battery',18)}</span><button class="mi" id="ccBtn">${ic('sliders',16)}</button><span class="mi" id="clk"></span>`;
let menuOpen=null;
function buildMenu(items){const m=$('#menu');m.innerHTML='';items.forEach(it=>{if(it==='-'){m.appendChild(document.createElement('hr'));return}
 const b=document.createElement('button');b.innerHTML=`<span>${it[0]}</span><span class="k">${it[2]||''}</span>`;if(!it[1])b.disabled=true;else b.onclick=()=>{closeMenu();it[1]()};m.appendChild(b)})}
function showMenu(name,btn){if(menuOpen===name){closeMenu();return}
 closePanels();menuOpen=name;buildMenu(MENUS[name]);const m=$('#menu');m.style.top='30px';m.style.left=btn.getBoundingClientRect().left+'px';m.style.display='block';
 document.querySelectorAll('#lbar .mi').forEach(x=>x.classList.toggle('on',x===btn))}
function closeMenu(){menuOpen=null;$('#menu').style.display='none';document.querySelectorAll('#lbar .mi').forEach(x=>x.classList.remove('on'))}
document.querySelectorAll('#lbar [data-m]').forEach(b=>{b.onclick=e=>{e.stopPropagation();showMenu(b.dataset.m,b)};b.onmouseenter=()=>{if(menuOpen&&menuOpen!==b.dataset.m&&menuOpen!=='ctx'){menuOpen=null;showMenu(b.dataset.m,b)}}});
function closePanels(){$('#cc').classList.remove('show');$('#spot').classList.remove('show');$('#wg').classList.remove('show');closeMenu()}
document.addEventListener('contextmenu',e=>{if(e.target.closest('.win,.wd,#dock,#bar,#lock,.panel,#menu'))return;e.preventDefault();closePanels();buildMenu(CTX);const m=$('#menu');menuOpen='ctx';m.style.left=Math.min(e.clientX,innerWidth-250)+'px';m.style.top=Math.min(e.clientY,innerHeight-200)+'px';m.style.display='block'});
$('#wgBtn').onclick=e=>{e.stopPropagation();const s=$('#wg').classList.contains('show');closePanels();if(!s)openGallery()};

/* ---------- spotlight ---------- */
const ACTS=[['Toggle Dark Mode','contrast',()=>setTheme(state.theme==='dark'?'light':'dark')],['Next Wallpaper','image',()=>setWall((Math.max(state.wall,-1)+1)%wallpapers.length)],['Edit Widgets','layout',()=>openGallery()],['Lock Screen','lock',()=>lock()]];
function spot(open){closePanels();$('#spot').classList.toggle('show',open);if(open){$('#q').value='';$('#q').focus();renderRes('')}}
function renderRes(q){
 q=q.toLowerCase();const r=$('#res');r.innerHTML='';
 const items=[...Object.entries(APPS).map(([id,a])=>[a.n,`<span class="mini2">${appIcon(id)}</span>`,()=>openApp(id)]),...ACTS.map(a=>[a[0],`<span class="mini gy">${ic(a[1],16)}</span>`,a[2]])].filter(x=>x[0].toLowerCase().includes(q));
 items.forEach((x,i)=>{const b=document.createElement('button');if(i===0)b.className='on';b.innerHTML=x[1]+x[0];b.onclick=()=>{spot(false);x[2]()};r.appendChild(b)});
 if(!items.length)r.innerHTML='<div class="dim" style="padding:12px">No results</div>';
}
$('#q').oninput=e=>renderRes(e.target.value);
$('#q').onkeydown=e=>{if(e.key==='Enter'){const f=$('#res button');if(f)f.click()}};
$('#bSearch').onclick=e=>{e.stopPropagation();spot(!$('#spot').classList.contains('show'))};

/* ---------- control center ---------- */
$('#iw').innerHTML=ic('wifi',17);$('#ib').innerHTML=ic('bt',17);$('#id').innerHTML=ic('contrast',17);$('#im').innerHTML=ic('moon',17);
$('#isun').innerHTML=ic('sun',16);$('#ivol').innerHTML=ic('vol',16);$('#isearch').innerHTML=ic('search',22,1.6);
$('#ccBtn').onclick=e=>{e.stopPropagation();const s=$('#cc').classList.contains('show');closePanels();if(!s)$('#cc').classList.add('show')};
$('#cc').onclick=e=>e.stopPropagation();$('#spot').onclick=e=>e.stopPropagation();
const tog=(id,fn)=>{$(id).onclick=()=>{const on=$(id).classList.toggle('on');$(id).querySelector('span:last-child').textContent=on?'On':'Off';fn&&fn(on)}};
tog('#tWifi',on=>$('#wifiI').style.opacity=on?1:.4);tog('#tBt');
tog('#tDnd',on=>{if(on)toast('Focus','Notifications are paused','settings',true)});
$('#tDark').onclick=()=>setTheme(state.theme==='dark'?'light':'dark');
$('#wifiI').onclick=()=>$('#tWifi').click();
const rng=(id,fn)=>{const r=$(id),u=()=>{r.style.setProperty('--v',((r.value-r.min)/(r.max-r.min)*100)+'%');fn&&fn(+r.value)};r.oninput=u;u()};
rng('#bright',v=>$('#dimmer').style.opacity=(100-v)/110);rng('#vol');
document.addEventListener('click',closePanels);

/* ---------- toast, lock, clock ---------- */
function toast(t,m,app,force){if($('#tDnd').classList.contains('on')&&!force)return;
 const d=document.createElement('div');d.className='toast blur';d.innerHTML=`<span class="mini2" style="width:34px;height:34px">${appIcon(APPS[app]?app:'settings')}</span><div><b>${esc(t)}</b><span class="t">${esc(m)}</span></div>`;
 $('#toasts').appendChild(d);setTimeout(()=>d.remove(),3400)}
function refreshLock(){const has=!!state.pw;$('#lpw').style.display=has?'block':'none';$('#lhint').style.display=has?'none':'block';$('#lmsg').textContent='';if(has&&!$('#lock').classList.contains('gone'))setTimeout(()=>$('#lpw').focus(),60)}
function lock(){closePanels();$('#lock').classList.remove('gone');$('#lpw').value='';refreshLock()}
function unlock(force){if($('#lock').classList.contains('gone'))return;if(state.pw&&!force)return;$('#lock').classList.add('gone');$('#lpw').blur();
 setTimeout(()=>toast('Welcome',canHide()?'Move your mouse to the bottom edge to show the dock':'Press Ctrl + Space to search','settings'),600)}
$('#lock').onclick=()=>{if(!state.pw)unlock();else $('#lpw').focus()};
$('#lpw').onclick=e=>e.stopPropagation();
$('#lpw').onkeydown=async e=>{if(e.key!=='Enter')return;e.stopPropagation();const el=e.target;
 if(await hashPw(el.value)===state.pw){el.value='';$('#lmsg').textContent='';unlock(true)}
 else{el.value='';$('#lmsg').textContent='Incorrect password';el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}};
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&!state.pw)unlock();
 if($('#lock').classList.contains('gone')){
  if((e.ctrlKey||e.metaKey)&&e.code==='Space'){e.preventDefault();spot(!$('#spot').classList.contains('show'))}
  if(e.key==='Escape')closePanels()}
});
function clock(){const d=new Date(),t=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
 $('#clk').textContent=d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})+'  '+t;
 $('#lockt').textContent=t.replace(/\s?[AP]M/i,'');$('#lockd').textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}

/* ---------- boot ---------- */
document.body.insertAdjacentHTML('beforeend',`<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>${Object.entries(G).map(([k,v])=>`<linearGradient id="g${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${v[0]}"/><stop offset="1" stop-color="${v[1]}"/></linearGradient>`).join('')}</defs></svg>`);
if(!state.widgets){const x=Math.max(20,innerWidth-256);state.widgets=[{id:uid(),type:'calendar',x,y:44,s:1,d:{}},{id:uid(),type:'weather',x,y:272,s:1,d:{}}]}
setAccent(state.accent);setTheme(state.theme);applyWall();applyTrans();applyDock();
state.widgets.forEach(renderWidget);
clock();setInterval(clock,15000);refreshLock();
</script>
</body>
</html>
